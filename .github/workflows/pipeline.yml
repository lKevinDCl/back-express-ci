# Nombre de tu pipeline que aparecerá en GitHub
name: CI/CD Pipeline Node.js

# 1. ¿Cuándo se ejecuta? (El equivalente a las 'rules' de GitLab)
on:
  push:
    branches: [ "main" ] # Se ejecuta cuando haces push a la rama main
  pull_request:
    branches: [ "main" ]

# 2. Definimos los trabajos (En GitHub no hay 'stages' globales, usamos 'needs' para el orden)
jobs:
  validate:
    runs-on: ubuntu-latest # El equivalente a usar una imagen de Docker base
    steps:
      # Action para que GitHub descargue tu código (GitLab lo hacía solo)
      - name: Descargar el código
        uses: actions/checkout@v4
      
      # Action para instalar Node.js 20 y configurar la caché automáticamente
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Instalar dependencias
        run: npm ci # 'npm ci' es más rápido y seguro para pipelines que 'npm install'
        
      - name: Auditar seguridad (ignorando devDependencies)
        run: npm audit --omit=dev

  test:
    needs: validate # Esto le dice que espere a que 'validate' termine con éxito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas de Jest
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simular empaquetado Docker
        run: echo "Aquí irían los comandos de Docker build..."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # El equivalente al 'only: - main' de GitLab
    steps:
      - name: Simular despliegue a producción
        run: |
          echo "Iniciando Despliegue Continuo (CD)..."
          echo "Conectando al servidor remoto..."
          echo "¡Tu API está en vivo!"